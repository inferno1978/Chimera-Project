# ============================================================
# Mirror to GitLab — one-way GitHub → GitLab
# ============================================================
# GitLab branch chimera-v5 is a MIRROR ONLY.
# Never commit directly to chimera-v5 on GitLab — changes will be
# force-overwritten on next push to main on GitHub.
#
# Flow: push to GitHub main → Actions triggers → force-push to
# GitLab chimera-v5 + tags.
#
# v2 (2026-10-03):
#   • retry ×5 с паузой 15 с — транзиентные 403/сеть;
#   • workflow_dispatch — ручной запуск (тест зеркала без коммита);
#   • аудит: SHA GitHub и SHA GitLab до/после в логе;
#   • concurrency — зеркала не наслаиваются.
#
# Required secrets:
#   GITLAB_TOKEN — GitLab PAT with write_repository scope
# ============================================================
name: Mirror to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (полная история + теги)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Push main → GitLab chimera-v5 (retry ×5 против транзиентных 403)
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -uo pipefail
          git remote add gitlab "https://oauth2:${GL_TOKEN}@gitlab.com/netwalker071778/chimera-project.git"
          git fetch gitlab chimera-v5 --quiet 2>/dev/null || echo "(на GitLab нет ветки chimera-v5 — будет создана)"
          BEFORE=$(git rev-parse refs/remotes/gitlab/chimera-v5 2>/dev/null || echo "нет")
          echo "GitHub main:              ${GITHUB_SHA}"
          echo "GitLab chimera-v5 (было): ${BEFORE}"
          ok=0
          for i in 1 2 3 4 5; do
            echo "— попытка ${i}/5"
            if git push --force gitlab "${GITHUB_SHA}:refs/heads/chimera-v5"; then ok=1; break; fi
            echo "!! пуш не прошёл, пауза 15 с перед повтором…"
            sleep 15
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::GitLab push не прошёл за 5 попыток — проверить токен/сеть GitLab"
            exit 1
          fi
          echo "✅ GitLab chimera-v5 = ${GITHUB_SHA}"

      - name: Push tags → GitLab (best-effort)
        id: push_tags
        continue-on-error: true
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          for i in 1 2 3; do
            if git push --force gitlab --tags; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Warn if tag push failed
        if: failure() && steps.push_tags.outcome == 'failure'
        run: |
          echo "::warning::Pushing tags to GitLab failed. Branch mirror succeeded."

name: Mirror to GitLab

on:
  push:
    branches: [main]
  tags: ['v*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/netwalker071778/chimera-project.git"
          git push --force gitlab refs/heads/main:refs/heads/chimera-v5
          git push --force gitlab refs/tags/*:refs/tags/* || true
        env:
          GIT_TERMINAL_PROMPT: 0
